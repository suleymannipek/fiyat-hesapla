<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Oda Hesaplama</title>
  <style>
    :root {
      --bg: #F0F2F5;
      --card-bg: #FFFFFF;
      --border: #D1D5DB;
      --text: #1F2937;
      --muted: #6B7280;
      --primary-blue: #0288D1;
      --teklif-color: #0097A7;
      --hesapla-color: #2E7D32;
      --detay-color: #0288D1;
      --temizle-color: #D32F2F;
    }

    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      display: flex;
      justify-content: center;
      padding: 8px;
    }

    .window-card {
      background: var(--card-bg);
      width: 100%;
      max-width: 390px;
      border-radius: 10px;
      border: 1px solid #B0BEC5;
      box-shadow: 0 4px 20px rgba(0,0,0,0.12);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Üst Başlık Çubuğu */
    .title-bar {
      background: #E8ECEF;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #CFD8DC;
    }

    .title-left {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 15px;
      color: #263238;
    }

    .app-icon {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: #E1F5FE;
      color: #0288D1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 900;
      border: 1px solid #B3E5FC;
    }

    /* Form İçeriği */
    .form-body {
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .top-select-row {
      display: grid;
      grid-template-columns: 1fr 45px;
      gap: 6px;
    }

    select, input[type="text"], input[type="number"] {
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 5px 6px;
      font-size: 13.5px;
      outline: none;
      background: #FFF;
      color: var(--text);
    }

    select {
      font-weight: 600;
    }

    input:focus, select:focus {
      border-color: #0288D1;
    }

    /* 2 Sütunlu Orta Bölüm */
    .middle-grid {
      display: grid;
      grid-template-columns: 1.25fr 1fr;
      gap: 8px;
    }

    .box-panel {
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 8px;
      background: #FAFAFA;
      display: flex;
      flex-direction: column;
    }

    .box-title {
      font-size: 12px;
      font-weight: 700;
      color: #374151;
      text-align: center;
      margin-bottom: 4px;
    }

    .period-header {
      display: flex;
      justify-content: flex-end;
      gap: 16px;
      font-size: 10.5px;
      font-weight: 700;
      color: #4B5563;
      padding-right: 4px;
      margin-bottom: 2px;
    }

    .line-row {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 3px;
    }

    .line-row label {
      font-size: 12px;
      font-weight: 600;
      width: 18px;
      color: #374151;
    }

    .line-row input {
      text-align: right;
      width: 100%;
      padding: 4px;
      font-size: 13px;
    }

    .period-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 4px;
      padding-top: 4px;
    }

    .total-nights {
      font-size: 12px;
      font-weight: 700;
      color: #1F2937;
    }

    .btn-page {
      background: #0077D7;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 4px 8px;
      font-weight: 800;
      font-size: 12px;
      cursor: pointer;
    }

    /* Misafir Bölümü */
    .guest-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 5px;
    }

    .guest-row input {
      width: 50px;
      text-align: center;
      padding: 4px;
      font-weight: 700;
    }

    .guest-row span {
      font-size: 12.5px;
      font-weight: 600;
      color: #374151;
    }

    .pax-text {
      font-size: 15px;
      font-weight: 800;
      color: #0D47A1;
      margin: 4px 0 2px 0;
    }

    .check-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: #1F2937;
      margin-top: 4px;
      cursor: pointer;
    }

    .check-row input {
      width: 15px;
      height: 15px;
    }

    /* 4 Buton Grubu */
    .button-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-top: 2px;
    }

    .action-btn {
      color: white;
      border: none;
      border-radius: 4px;
      padding: 9px 4px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .action-btn:active {
      opacity: 0.85;
      transform: scale(0.98);
    }

    .btn-teklif { background-color: var(--teklif-color); }
    .btn-hesapla { background-color: var(--hesapla-color); }
    .btn-detaylar { background-color: var(--detay-color); }
    .btn-temizle { background-color: var(--temizle-color); }

    /* Sonuç Alanı */
    .result-display {
      background: #FFFFFF;
      border: 1px solid #90CAF9;
      border-radius: 4px;
      padding: 6px;
      text-align: left;
      font-size: 13.5px;
      font-weight: 800;
      color: #0D47A1;
      min-height: 32px;
      display: flex;
      align-items: center;
    }

    /* Alt Çubuk */
    .bottom-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 2px;
    }

    .switch-link {
      color: #0288D1;
      font-size: 12px;
      font-weight: 700;
      text-decoration: underline;
      cursor: pointer;
    }

    .version-tag {
      font-size: 11px;
      color: #9E9E9E;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="window-card">
    
    <!-- 1. ODA HESAPLAMA MODÜLÜ -->
    <div id="odaModulu">
      <div class="title-bar">
        <div class="title-left">
          <div class="app-icon">oda</div>
          <span>Oda Hesaplama</span>
        </div>
        <div style="font-size: 14px; color: #546E7A; cursor: pointer;" title="Pin">📌</div>
      </div>

      <div class="form-body">
        <!-- Oda Seçimi ve Yanındaki Kutu -->
        <div class="top-select-row">
          <select id="odaTipi" onchange="odaSecildi()"></select>
          <input type="text" id="odaKodu" placeholder="">
        </div>

        <!-- 2 Sütunlu Alan -->
        <div class="middle-grid">
          <!-- Fiyat/Gece Paneli -->
          <div class="box-panel">
            <div class="box-title" id="lblPeriyotBaslik">Fiyat/Gece (1-5)</div>
            <div class="period-header">
              <span>FİYAT</span>
              <span>GECE</span>
            </div>

            <div id="periyotKonteyner">
              <!-- JS ile 5 satır dinamik basılacak -->
            </div>

            <div class="period-footer">
              <span class="total-nights" id="odaToplamGece">Toplam: 0 Gece</span>
              <button class="btn-page" id="btnSayfa" onclick="sayfaDegistir()">&gt;&gt;</button>
            </div>
          </div>

          <!-- Misafir Paneli -->
          <div class="box-panel">
            <div class="box-title">Misafir</div>

            <div class="guest-row">
              <input type="number" id="txtYetiskin" value="2" min="1">
              <span>Yetişkin</span>
            </div>
            <div class="guest-row">
              <input type="number" id="txtCocuk712" value="0" min="0">
              <span>7-12 Yaş</span>
            </div>
            <div class="guest-row">
              <input type="number" id="txtCocuk06" value="0" min="0">
              <span>0-6 Yaş</span>
            </div>

            <div class="pax-text" id="lblPax">PAX: 2.0</div>

            <label class="check-row">
              <input type="checkbox" id="chk012Ucretsiz" checked> 🎁 0-12 Yaş Ücr.
            </label>

            <label class="check-row">
              <input type="checkbox" id="chkDetayliKurallar"> Detaylı Kurallar
            </label>
          </div>
        </div>

        <!-- 4 İşlem Butonu -->
        <div class="button-grid">
          <button class="action-btn btn-teklif" onclick="odaCiftTeklif()">ÇİFT TEKLİF (Ç)</button>
          <button class="action-btn btn-hesapla" onclick="odaHesapla()">🗎 HESAPLA (H)</button>
          <button class="action-btn btn-detaylar" onclick="odaDetaylar()">🗎 DETAYLAR (D)</button>
          <button class="action-btn btn-temizle" onclick="odaTemizle()">🖋 TEMİZLE (T)</button>
        </div>

        <!-- Sonuç Şeridi -->
        <div class="result-display" id="odaSonuc">Top: 0 TL | Ort: 0 TL</div>

        <!-- Alt Menü -->
        <div class="bottom-bar">
          <span class="switch-link" onclick="modulDegistir('villa')">⮌ Villa Rezervasyon Modülüne Dön</span>
          <span class="version-tag">Mobil v1.0</span>
        </div>
      </div>
    </div>

    <!-- 2. VİLLA HESAPLAMA MODÜLÜ -->
    <div id="villaModulu" class="hidden">
      <div class="title-bar">
        <div class="title-left">
          <div class="app-icon" style="background:#E8F5E9; color:#2E7D32; border-color:#C8E6C9;">villa</div>
          <span>Villa Hesaplama</span>
        </div>
      </div>

      <div class="form-body">
        <select id="villaTipi" onchange="villaSecildi()"></select>

        <div class="box-panel" style="gap: 8px;">
          <div class="line-row">
            <span style="font-size:12.5px; font-weight:600; width:110px;">Dönem Fiyatı:</span>
            <select id="villaFiyatSecim" onchange="villaFiyatAyarla()"></select>
          </div>
          <div class="line-row">
            <span style="font-size:12.5px; font-weight:600; width:110px;">Günlük Fiyat (₺):</span>
            <input type="number" id="villaFiyat">
          </div>
          <div class="line-row">
            <span style="font-size:12.5px; font-weight:600; width:110px;">Gece Sayısı:</span>
            <input type="number" id="villaGece">
          </div>
        </div>

        <div class="button-grid">
          <button class="action-btn btn-teklif" onclick="villaCiftTeklif()">ÇİFT TEKLİF (Ç)</button>
          <button class="action-btn btn-hesapla" onclick="villaHesapla()">🗎 HESAPLA (H)</button>
          <button class="action-btn btn-detaylar" onclick="villaDetaylar()">🗎 DETAYLAR (D)</button>
          <button class="action-btn btn-temizle" onclick="villaTemizle()">🖋 TEMİZLE (T)</button>
        </div>

        <div class="result-display" id="villaSonuc">Top: 0 TL</div>

        <div class="bottom-bar">
          <span class="switch-link" onclick="modulDegistir('oda')">⮌ Oda Hesaplama Modülüne Dön</span>
          <span class="version-tag">Mobil v1.0</span>
        </div>
      </div>
    </div>

  </div>

  <script>
    let aktifSayfa = 1; // 1: (1-5), 2: (6-10)
    let periyotFiyatlari = Array(10).fill(0);
    let periyotGeceleri = Array(10).fill('');

    let odaVerileri = {};
    let villaVerileri = {};

    // 5 SATIRLIK ARAYÜZÜ OLUŞTUR
    function periyotlariCiz() {
      const konteyner = document.getElementById('periyotKonteyner');
      konteyner.innerHTML = '';
      const baslangic = aktifSayfa === 1 ? 0 : 5;

      document.getElementById('lblPeriyotBaslik').innerText = aktifSayfa === 1 ? 'Fiyat/Gece (1-5)' : 'Fiyat/Gece (6-10)';
      document.getElementById('btnSayfa').innerText = aktifSayfa === 1 ? '>>' : '<<';

      for (let i = 0; i < 5; i++) {
        const index = baslangic + i;
        const row = document.createElement('div');
        row.className = 'line-row';
        row.innerHTML = `
          <label>${index + 1}.</label>
          <input type="number" class="p-fiyat" data-idx="${index}" value="${periyotFiyatlari[index] || ''}">
          <input type="number" class="p-gece" data-idx="${index}" value="${periyotGeceleri[index] || ''}">
        `;
        konteyner.appendChild(row);
      }

      // Değişiklikleri diziye yazma
      document.querySelectorAll('.p-fiyat').forEach(inp => {
        inp.oninput = (e) => periyotFiyatlari[e.target.dataset.idx] = parseFloat(e.target.value) || 0;
      });
      document.querySelectorAll('.p-gece').forEach(inp => {
        inp.oninput = (e) => {
          periyotGeceleri[e.target.dataset.idx] = e.target.value;
          geceToplamiGuncelle();
        };
      });

      // Tıklanınca seçme
      document.querySelectorAll('input').forEach(inp => {
        inp.onfocus = function() { setTimeout(() => this.select(), 50); };
      });
    }

    function sayfaDegistir() {
      aktifSayfa = aktifSayfa === 1 ? 2 : 1;
      periyotlariCiz();
    }

    function geceToplamiGuncelle() {
      let topGece = periyotGeceleri.reduce((toplam, g) => toplam + (parseInt(g) || 0), 0);
      document.getElementById('odaToplamGece').innerText = `Toplam: ${topGece} Gece`;
      return topGece;
    }

    // INI DOSYASINI OKUMA
    async function fiyatlariYukle() {
      try {
        const response = await fetch('fiyatlar.txt?v=' + Date.now());
        if (!response.ok) throw new Error("Dosya bulunamadı");
        const metin = await response.text();

        const satirlar = metin.split(/\r?\n/);
        let aktifBolum = '';
        odaVerileri = {};
        villaVerileri = {};

        satirlar.forEach(satir => {
          satir = satir.trim();
          if (!satir || satir.startsWith(';') || satir.startsWith('#')) return;

          if (satir.startsWith('[') && satir.endsWith(']')) {
            aktifBolum = satir.substring(1, satir.length - 1).trim();
            if (aktifBolum.toLowerCase().includes('villa')) {
              villaVerileri[aktifBolum] = { fiyatlar: {}, degisken: 0 };
            } else {
              odaVerileri[aktifBolum] = Array(10).fill(0);
            }
          } else if (aktifBolum && satir.includes('=')) {
            const [anahtar, deger] = satir.split('=').map(s => s.trim());
            const sayi = parseFloat(deger) || 0;

            if (aktifBolum.toLowerCase().includes('villa')) {
              if (anahtar.startsWith('fiyat')) villaVerileri[aktifBolum].fiyatlar[anahtar] = sayi;
              if (anahtar === 'degisken') villaVerileri[aktifBolum].degisken = sayi;
            } else {
              if (anahtar.startsWith('periyot')) {
                const s = parseInt(anahtar.replace('periyot', '')) - 1;
                if (s >= 0 && s < 10) odaVerileri[aktifBolum][s] = sayi;
              }
            }
          }
        });

        // Seçim kutularını doldur
        const odaSelect = document.getElementById('odaTipi');
        odaSelect.innerHTML = '';
        Object.keys(odaVerileri).forEach(o => {
          const opt = document.createElement('option');
          opt.value = o;
          opt.textContent = o;
          odaSelect.appendChild(opt);
        });

        const villaSelect = document.getElementById('villaTipi');
        villaSelect.innerHTML = '';
        Object.keys(villaVerileri).forEach(v => {
          const opt = document.createElement('option');
          opt.value = v;
          opt.textContent = v;
          villaSelect.appendChild(opt);
        });

        odaSecildi();
        villaSecildi();

      } catch (e) {
        console.log("fiyatlar.txt okunamadı, varsayılan çalışıyor.");
        periyotlariCiz();
      }
    }

    function odaSecildi() {
      const secilen = document.getElementById('odaTipi').value;
      if (odaVerileri[secilen]) {
        periyotFiyatlari = [...odaVerileri[secilen]];
      }
      periyotlariCiz();
    }

    // PAX HESAPLAMA
    function paxHesapla() {
      const y = parseFloat(document.getElementById('txtYetiskin').value) || 0;
      const c712 = parseFloat(document.getElementById('txtCocuk712').value) || 0;
      const ucr = document.getElementById('chk012Ucretsiz').checked;

      let pax = ucr ? y : y + (c712 * 0.5);
      document.getElementById('lblPax').innerText = 'PAX: ' + pax.toFixed(1);
      return pax;
    }

    ['txtYetiskin', 'txtCocuk712', 'txtCocuk06'].forEach(id => {
      document.getElementById(id).addEventListener('input', paxHesapla);
    });
    document.getElementById('chk012Ucretsiz').addEventListener('change', paxHesapla);

    // ODA HESAPLAMA
    function odaHesapla() {
      const pax = paxHesapla();
      const ucr = document.getElementById('chk012Ucretsiz').checked;
      let katsayi = 1.0;
      if (!ucr) {
        katsayi = pax / 2.0;
        if (katsayi < 1.0) katsayi = 1.0;
      }

      let toplamGece = 0;
      let toplamTutar = 0;

      for (let i = 0; i < 10; i++) {
        const f = periyotFiyatlari[i] || 0;
        const g = parseInt(periyotGeceleri[i]) || 0;
        if (f > 0 && g > 0) {
          toplamGece += g;
          toplamTutar += (f * g * katsayi);
        }
      }

      const ortalama = toplamGece > 0 ? (toplamTutar / toplamGece) : 0;
      const sonucMetni = `Top: ${Math.round(toplamTutar).toLocaleString('tr-TR')} TL | Ort: ${Math.round(ortalama).toLocaleString('tr-TR')} TL`;
      
      document.getElementById('odaSonuc').innerText = sonucMetni;
      return { toplamTutar, ortalama, toplamGece, sonucMetni };
    }

    function odaCiftTeklif() {
      const res = odaHesapla();
      if (res.toplamTutar > 0) {
        const metin = `Nakit/Havale Fiyatı: ${Math.round(res.toplamTutar).toLocaleString('tr-TR')} TL\nKredi Kartı Tek Çekim: ${Math.round(res.toplamTutar).toLocaleString('tr-TR')} TL`;
        navigator.clipboard.writeText(metin);
        alert('Teklif panoya kopyalandı:\n\n' + metin);
      }
    }

    function odaDetaylar() {
      const oda = document.getElementById('odaTipi').value;
      const res = odaHesapla();
      alert(`--- REZERVASYON DETAYI ---\nOda: ${oda}\nToplam Gece: ${res.toplamGece}\n${res.sonucMetni}`);
    }

    function odaTemizle() {
      periyotGeceleri = Array(10).fill('');
      document.getElementById('txtYetiskin').value = '2';
      document.getElementById('txtCocuk712').value = '0';
      document.getElementById('txtCocuk06').value = '0';
      document.getElementById('chk012Ucretsiz').checked = true;
      document.getElementById('chkDetayliKurallar').checked = false;
      document.getElementById('odaSonuc').innerText = 'Top: 0 TL | Ort: 0 TL';
      geceToplamiGuncelle();
      paxHesapla();
      periyotlariCiz();
    }

    // VİLLA MODÜLÜ İŞLEMLERİ
    function villaSecildi() {
      const secilen = document.getElementById('villaTipi').value;
      const veri = villaVerileri[secilen];
      const secim = document.getElementById('villaFiyatSecim');
      secim.innerHTML = '';

      if (veri && veri.fiyatlar) {
        Object.keys(veri.fiyatlar).forEach((k, i) => {
          const opt = document.createElement('option');
          opt.value = veri.fiyatlar[k];
          opt.textContent = `${i + 1}. Sezon (${veri.fiyatlar[k]} ₺)`;
          secim.appendChild(opt);
        });
      }
      villaFiyatAyarla();
    }

    function villaFiyatAyarla() {
      document.getElementById('villaFiyat').value = document.getElementById('villaFiyatSecim').value || '';
    }

    function villaHesapla() {
      const f = parseFloat(document.getElementById('villaFiyat').value) || 0;
      const g = parseInt(document.getElementById('villaGece').value) || 0;
      const secilen = document.getElementById('villaTipi').value;
      const degisken = (villaVerileri[secilen] && villaVerileri[secilen].degisken) || 0;

      let top = f * g;
      if (g > 0 && g < 7 && degisken > 0) top += degisken;

      const metin = `Top: ${Math.round(top).toLocaleString('tr-TR')} TL`;
      document.getElementById('villaSonuc').innerText = metin;
      return { top, g, degisken, metin };
    }

    function villaCiftTeklif() {
      const r = villaHesapla();
      if (r.top > 0) {
        const metin = `Villa Konaklama Teklifi: ${Math.round(r.top).toLocaleString('tr-TR')} TL`;
        navigator.clipboard.writeText(metin);
        alert('Teklif panoya kopyalandı:\n\n' + metin);
      }
    }

    function villaDetaylar() {
      const r = villaHesapla();
      let ekstra = (r.g < 7 && r.degisken > 0) ? `\n(7 gece altı +${r.degisken} TL temizlik ücreti eklendi)` : '';
      alert(`Villa Detayı\nToplam Gece: ${r.g}\n${r.metin}${ekstra}`);
    }

    function villaTemizle() {
      document.getElementById('villaGece').value = '';
      document.getElementById('villaSonuc').innerText = 'Top: 0 TL';
      villaFiyatAyarla();
    }

    // MODÜL DEĞİŞTİRME
    function modulDegistir(hedef) {
      if (hedef === 'villa') {
        document.getElementById('odaModulu').classList.add('hidden');
        document.getElementById('villaModulu').classList.remove('hidden');
      } else {
        document.getElementById('villaModulu').classList.add('hidden');
        document.getElementById('odaModulu').classList.remove('hidden');
      }
    }

    // BAŞLATMA
    periyotlariCiz();
    fiyatlariYukle();
  </script>
</body>
</html>
